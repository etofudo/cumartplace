<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuMartplace – Product Detail</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .product-detail { display:grid; grid-template-columns:1fr 1fr; gap:40px; background:#fff; border-radius:12px; padding:30px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:30px; }
    .product-detail img { width:100%; border-radius:8px; object-fit:cover; max-height:360px; background:#eee; }
    .product-info h1   { font-size:1.5rem; margin-bottom:10px; }
    .product-info .price { font-size:1.8rem; color:#e94560; font-weight:700; margin:10px 0; }
    .product-info .meta  { color:#888; font-size:0.9rem; margin-bottom:20px; line-height:1.8; }
    .qty-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .qty-row input { width:70px; padding:8px; border:1.5px solid #ddd; border-radius:6px; text-align:center; font-size:1rem; }
    .review-form { background:#fff; border-radius:8px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-top:20px; }
    @media(max-width:640px){ .product-detail{grid-template-columns:1fr;} }
  </style>
</head>
<body>

<nav id="nav-root"></nav>

<div class="container">
  <a href="/" style="color:#e94560; text-decoration:none; font-size:0.9rem;">← Back to Products</a>
  <div id="content" style="margin-top:20px"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
  const productId = new URLSearchParams(location.search).get('id');

  window.addEventListener('DOMContentLoaded', () => {
    renderNav('products');
    if (!productId) {
      document.getElementById('content').innerHTML = '<p>No product ID provided.</p>';
      return;
    }
    loadProduct();
  });

  // GET /api/products/:id → ProductController.getOne → ProductModel.findById (Model)
  async function loadProduct() {
    showSpinner('content');
    try {
      const p = await api.get(`/products/${productId}`);
      document.title = `${p.name} – CuMartplace`;

      document.getElementById('content').innerHTML = `
        <div class="product-detail">
          <img src="${p.image_url || 'https://placehold.co/480x360?text=No+Image'}" alt="${p.name}">
          <div class="product-info">
            <h1>${p.name}</h1>
            <div class="price">${naira(p.price)}</div>
            <div class="meta">
              Store: <strong>${p.store_name}</strong><br>
              Category: <strong>${p.category_name}</strong><br>
              Rating: <strong>★ ${parseFloat(p.avg_rating).toFixed(1)}</strong> (${p.review_count} reviews)<br>
              Stock: <strong>${p.stock_quantity} available</strong>
            </div>
            <p style="margin-bottom:20px;color:#444">${p.description || 'No description provided.'}</p>

            <div class="alert" id="cartAlert"></div>

            <div class="qty-row">
              <label style="font-weight:600">Qty:</label>
              <input type="number" id="qty" value="1" min="1" max="${p.stock_quantity}">
            </div>
            <button class="btn btn-primary" onclick="addToCart(${p.product_id})">Add to Cart</button>
          </div>
        </div>

        <div>
          <h2>Customer Reviews</h2>
          <div id="reviewsList"></div>

          <div class="review-form" id="reviewForm" style="display:none">
            <h2>Leave a Review</h2>
            <div class="alert" id="reviewAlert"></div>
            <div class="form-group">
              <label>Rating</label>
              <select id="reviewRating">
                <option value="5">★★★★★ – Excellent</option>
                <option value="4">★★★★☆ – Good</option>
                <option value="3">★★★☆☆ – Average</option>
                <option value="2">★★☆☆☆ – Poor</option>
                <option value="1">★☆☆☆☆ – Terrible</option>
              </select>
            </div>
            <div class="form-group">
              <label>Comment (optional)</label>
              <textarea id="reviewComment" rows="3"
                style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:6px;"></textarea>
            </div>
            <button class="btn btn-primary" onclick="submitReview(${p.product_id})">Submit Review</button>
          </div>
        </div>
      `;

      loadReviews(p.product_id);

      const user = getUser();
      if (user && user.role === 'buyer') {
        document.getElementById('reviewForm').style.display = 'block';
      }

    } catch (err) {
      document.getElementById('content').innerHTML = `<p style="color:red">${err.message}</p>`;
    }
  }

  // POST /api/cart/items → CartController.addItem → CartModel.addItem (Model)
  async function addToCart(pid) {
    if (!getToken()) { window.location.href = '/login.html'; return; }
    const quantity = parseInt(document.getElementById('qty').value);
    try {
      await api.post('/cart/items', { product_id: pid, quantity });
      showAlert('cartAlert', '✓ Added to cart!', 'success');
    } catch (err) {
      showAlert('cartAlert', err.message, 'error');
    }
  }

  // GET /api/products/:id/reviews → ReviewController.getProductReviews (Model)
  async function loadReviews(pid) {
    try {
      const reviews = await api.get(`/products/${pid}/reviews`);
      const list = document.getElementById('reviewsList');
      if (!reviews.length) {
        list.innerHTML = '<p style="color:#999;margin-bottom:12px">No reviews yet. Be the first!</p>';
        return;
      }
      // reviewCardHtml() lives in components.js
      list.innerHTML = reviews.map(reviewCardHtml).join('');
    } catch (err) {
      document.getElementById('reviewsList').innerHTML =
        '<p style="color:red">Could not load reviews.</p>';
    }
  }

  // POST /api/products/:id/reviews → ReviewController.createProductReview (Model)
  async function submitReview(pid) {
    const rating  = parseInt(document.getElementById('reviewRating').value);
    const comment = document.getElementById('reviewComment').value.trim();
    try {
      await api.post(`/products/${pid}/reviews`, { rating, ...(comment ? { comment } : {}) });
      showAlert('reviewAlert', 'Review submitted!', 'success');
      document.getElementById('reviewForm').style.display = 'none';
      loadReviews(pid);
    } catch (err) {
      showAlert('reviewAlert', err.message, 'error');
    }
  }
</script>
</body>
</html>
