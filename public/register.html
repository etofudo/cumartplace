<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuMartplace – Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav id="nav-root"></nav>

<div class="form-card">
  <h1>Create Account</h1>

  <div class="alert" id="alert"></div>

  <form id="registerForm">
    <div class="form-group">
      <label>First name</label>
      <input type="text" id="first_name" placeholder="Israel" required>
    </div>
    <div class="form-group">
      <label>Last name</label>
      <input type="text" id="last_name" placeholder="Odufote" required>
    </div>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Phone (optional)</label>
      <input type="tel" id="phone" placeholder="+2348000000000">
    </div>
    <div class="form-group">
      <label>Account type</label>
      <select id="role">
        <option value="buyer">Buyer – I want to shop</option>
        <option value="vendor">Vendor – I want to sell</option>
      </select>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
  </form>

  <p class="form-footer">
    Already have an account? <a href="/login.html">Login here</a>
  </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    redirectIfLoggedIn();
    renderNav('register');
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('alert');

    const phone = document.getElementById('phone').value.trim();
    const body  = {
      first_name: document.getElementById('first_name').value.trim(),
      last_name:  document.getElementById('last_name').value.trim(),
      email:      document.getElementById('email').value.trim(),
      role:       document.getElementById('role').value,
      password:   document.getElementById('password').value,
      ...(phone ? { phone } : {}),
    };

    try {
      // POST /api/auth/register → AuthController.register → UserModel.create (Model)
      await api.post('/auth/register', body);
      showAlert('alert', 'Account created! Redirecting to login…', 'success');
      setTimeout(() => window.location.href = '/login.html', 1200);
    } catch (err) {
      showAlert('alert', err.message, 'error');
    }
  });
</script>
</body>
</html>
