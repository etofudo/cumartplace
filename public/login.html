<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuMartplace – Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav id="nav-root"></nav>

<div class="form-card">
  <h1>Login</h1>

  <div class="alert" id="alert"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Login</button>
  </form>

  <p class="form-footer">
    Don't have an account? <a href="/register.html">Register here</a>
  </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    redirectIfLoggedIn();         // shared helper from components.js
    renderNav('login');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('alert');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      // POST /api/auth/login → AuthController.login → UserModel.findByEmail (Model)
      const data = await api.post('/auth/login', { email, password });
      saveSession(data.token, data.user);
      showAlert('alert', 'Login successful! Redirecting…', 'success');
      setTimeout(() => window.location.href = '/', 1000);
    } catch (err) {
      showAlert('alert', err.message, 'error');
    }
  });
</script>
</body>
</html>
